[package]
name = "ludomere"
version = "0.2.1"
edition = "2024"
rust-version = "1.92"
description = "A native GOG library, download, and game manager for Linux."
license = "GPL-3.0-or-later"

[dependencies]
libc = "0.2"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
chacha20poly1305 = "0.10"
dirs = "6.0"
fs2 = "0.4"
flate2 = "1.1"
gdk-pixbuf = "0.22"
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
rusqlite = { version = "0.37", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
keyring = { version = "3.6", default-features = false, features = ["sync-secret-service", "crypto-rust"] }
ksni = { version = "0.3.6", features = ["blocking"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
md5 = "0.7"
portable-pty = "0.9"
quick-xml = "0.38"
webkit6 = { version = "0.6", features = ["v2_50"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tar = "0.4.46"
tempfile = "3.23"
xz2 = "0.1.7"
shell-words = "1.1"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
strip = true
